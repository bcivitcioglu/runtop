{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ 'assets/brand/favicon-32.png' | url }}">
  <link rel="apple-touch-icon" href="{{ 'assets/brand/icon-512.png' | url }}">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/brand/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="runtop - {{ config.site_description }}">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
