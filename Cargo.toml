[package]
name = "runtop"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A compact terminal workspace for containers and their machines"
license = "MIT"
repository = "https://github.com/bcivitcioglu/runtop"
readme = "rust/README.md"
keywords = ["containers", "terminal", "monitor", "tui"]
categories = ["command-line-utilities"]
include = ["/rust/**", "/spec/fixtures/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE"]

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "runtop"
path = "rust/src/bin/runtop.rs"

[[bin]]
name = "rt"
path = "rust/src/bin/rt.rs"

[[test]]
name = "contract"
path = "rust/tests/contract.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-util", "sync", "signal"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
